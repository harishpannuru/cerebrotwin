services:
  - type: web
    name: cerebrotwin
    runtime: python
    buildCommand: pip install -r requirements.txt && python main.py train && python main.py evaluate
    startCommand: streamlit run src/app/dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
